openapi: 3.0.3
info:
  title: MiniBlog API
  description: |
    API REST de MiniBlog (DevSpark) para gestionar authors y posts.
    Node.js + Express + PostgreSQL (consultas SQL directas con pg).
  version: 1.0.0
servers:
  - url: http://localhost:3000
    description: Local
  # Reemplazar por la URL pública de Railway una vez desplegado
  - url: https://TU-APP.up.railway.app
    description: Producción (Railway)

tags:
  - name: Authors
  - name: Posts

paths:
  /authors:
    get:
      tags: [Authors]
      summary: Listar authors
      responses:
        '200':
          description: Lista de authors ordenada por id
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Author'
        '500':
          $ref: '#/components/responses/InternalError'
    post:
      tags: [Authors]
      summary: Crear un author
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AuthorInput'
      responses:
        '201':
          description: Author creado
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Author'
        '400':
          description: Faltan name o email
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '409':
          $ref: '#/components/responses/DuplicateEmail'
        '500':
          $ref: '#/components/responses/InternalError'

  /authors/{id}:
    parameters:
      - $ref: '#/components/parameters/IdParam'
    get:
      tags: [Authors]
      summary: Detalle de un author
      responses:
        '200':
          description: Author encontrado
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Author'
        '400':
          $ref: '#/components/responses/InvalidId'
        '404':
          $ref: '#/components/responses/AuthorNotFound'
        '500':
          $ref: '#/components/responses/InternalError'
    put:
      tags: [Authors]
      summary: Actualizar un author
      description: Solo se modifican los campos enviados.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AuthorUpdate'
      responses:
        '200':
          description: Author actualizado
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Author'
        '400':
          $ref: '#/components/responses/InvalidId'
        '404':
          $ref: '#/components/responses/AuthorNotFound'
        '409':
          $ref: '#/components/responses/DuplicateEmail'
        '500':
          $ref: '#/components/responses/InternalError'
    delete:
      tags: [Authors]
      summary: Eliminar un author
      description: Elimina también sus posts (ON DELETE CASCADE).
      responses:
        '204':
          description: Author eliminado (sin contenido)
        '400':
          $ref: '#/components/responses/InvalidId'
        '404':
          $ref: '#/components/responses/AuthorNotFound'
        '500':
          $ref: '#/components/responses/InternalError'

  /posts:
    get:
      tags: [Posts]
      summary: Listar posts
      responses:
        '200':
          description: Lista de posts ordenada por id
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Post'
        '500':
          $ref: '#/components/responses/InternalError'
    post:
      tags: [Posts]
      summary: Crear un post
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PostInput'
      responses:
        '201':
          description: Post creado
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Post'
        '400':
          description: Faltan title, content o author_id, o el author no existe
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '500':
          $ref: '#/components/responses/InternalError'

  /posts/author/{authorId}:
    get:
      tags: [Posts]
      summary: Posts de un author, con el detalle del author
      parameters:
        - name: authorId
          in: path
          required: true
          description: ID del author
          schema:
            type: integer
            minimum: 1
          example: 1
      responses:
        '200':
          description: Author y su lista de posts (puede estar vacía)
          content:
            application/json:
              schema:
                type: object
                properties:
                  author:
                    $ref: '#/components/schemas/Author'
                  posts:
                    type: array
                    items:
                      $ref: '#/components/schemas/Post'
        '400':
          description: authorId inválido
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              example:
                error: Invalid authorId
        '404':
          $ref: '#/components/responses/AuthorNotFound'
        '500':
          $ref: '#/components/responses/InternalError'

  /posts/{id}:
    parameters:
      - $ref: '#/components/parameters/IdParam'
    get:
      tags: [Posts]
      summary: Detalle de un post
      responses:
        '200':
          description: Post encontrado
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Post'
        '400':
          $ref: '#/components/responses/InvalidId'
        '404':
          $ref: '#/components/responses/PostNotFound'
        '500':
          $ref: '#/components/responses/InternalError'
    put:
      tags: [Posts]
      summary: Actualizar un post
      description: Solo se modifican los campos enviados.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PostUpdate'
      responses:
        '200':
          description: Post actualizado
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Post'
        '400':
          description: id inválido o el author_id enviado no existe
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '404':
          $ref: '#/components/responses/PostNotFound'
        '500':
          $ref: '#/components/responses/InternalError'
    delete:
      tags: [Posts]
      summary: Eliminar un post
      responses:
        '204':
          description: Post eliminado (sin contenido)
        '400':
          $ref: '#/components/responses/InvalidId'
        '404':
          $ref: '#/components/responses/PostNotFound'
        '500':
          $ref: '#/components/responses/InternalError'

components:
  parameters:
    IdParam:
      name: id
      in: path
      required: true
      description: ID numérico (entero positivo)
      schema:
        type: integer
        minimum: 1
      example: 1

  schemas:
    Author:
      type: object
      properties:
        id:
          type: integer
          example: 1
        name:
          type: string
          example: Susana Cordisco
        email:
          type: string
          format: email
          example: scord@gmail.com
        bio:
          type: string
          nullable: true
          example: escritora de poesias, cuentos y microficciones
        created_at:
          type: string
          format: date-time
          example: '2026-11-11T14:16:58.370Z'
    AuthorInput:
      type: object
      required: [name, email]
      properties:
        name:
          type: string
          example: Susana Cordisco
        email:
          type: string
          format: email
          description: Debe ser único
          example: scord@gmail.com
        bio:
          type: string
          description: Opcional
          example: escritora de poesias, cuentos y microficciones
    AuthorUpdate:
      type: object
      properties:
        name:
          type: string
          example: Nombre nuevo
        email:
          type: string
          format: email
          description: Debe ser único
          example: nuevo@gmail.com
        bio:
          type: string
          example: Bio nueva
    Post:
      type: object
      properties:
        id:
          type: integer
          example: 1
        title:
          type: string
          example: Lluvia de marzo
        content:
          type: string
          example: Poema sobre las tardes de lluvia...
        author_id:
          type: integer
          example: 1
        published:
          type: boolean
          example: true
        created_at:
          type: string
          format: date-time
          example: '2026-11-11T14:16:58.370Z'
    PostInput:
      type: object
      required: [title, content, author_id]
      properties:
        title:
          type: string
          example: Mi post
        content:
          type: string
          example: Texto del post
        author_id:
          type: integer
          description: Debe existir en authors
          example: 1
        published:
          type: boolean
          default: false
    PostUpdate:
      type: object
      properties:
        title:
          type: string
        content:
          type: string
        author_id:
          type: integer
          description: Debe existir en authors
        published:
          type: boolean
    Error:
      type: object
      properties:
        error:
          type: string
          example: Author not found

  responses:
    InvalidId:
      description: El id de la URL no es un entero positivo
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
          example:
            error: Invalid id
    AuthorNotFound:
      description: Author no encontrado
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
          example:
            error: Author not found
    PostNotFound:
      description: Post no encontrado
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
          example:
            error: Post not found
    DuplicateEmail:
      description: Ya existe un author con ese email
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
    InternalError:
      description: Error interno del servidor
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'